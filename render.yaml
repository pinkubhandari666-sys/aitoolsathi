services:
  - type: web
    name: aitoolsathi-pdf-api
    runtime: docker
    rootDir: ghostscript-backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://aitoolsathi.in,https://www.aitoolsathi.in
      - key: MAX_UPLOAD_MB
        value: "30"
